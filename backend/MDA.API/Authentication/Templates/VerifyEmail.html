<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"></head>
<body style="margin:0;background:#f5f7fb;font-family:Arial,sans-serif;color:#101827">
  <div style="max-width:600px;margin:0 auto;padding:40px 20px">
    <div style="background:#ffffff;border:1px solid #dfe4ec;border-radius:18px;padding:40px">
      <div style="font-size:18px;font-weight:800;color:#2457f5">MDA</div>
      <h1 style="margin:28px 0 12px;font-size:28px">Welcome to MDA, {{DISPLAY_NAME}}</h1>
      <p style="margin:0 0 24px;line-height:1.6;color:#536176">Verify your email address to finish creating your account and access your manufacturing data workspace.</p>
      <a href="{{VERIFY_URL}}" style="display:inline-block;padding:13px 22px;border-radius:10px;background:#2457f5;color:#ffffff;text-decoration:none;font-weight:700">Verify Email</a>
      <p style="margin:28px 0 8px;font-size:13px;line-height:1.5;color:#69768a">If the button does not work, copy this link into your browser:</p>
      <p style="margin:0;word-break:break-all;font-size:13px;line-height:1.5"><a href="{{VERIFY_URL}}" style="color:#2457f5">{{VERIFY_URL}}</a></p>
      <p style="margin:28px 0 0;font-size:13px;color:#8a95a5">This link expires in 24 hours and can only be used once.</p>
    </div>
  </div>
</body>
</html>
